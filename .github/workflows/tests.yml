name: tests

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # timeout-minutes: hook-runner tests spawn `sleep 30` process groups; a wedged child must not hold
  # a runner for 6 h.
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run test:run

  # Aggregator → the single required "ci" status check (green only if every matrix job passed).
  # `if: always()` keeps it from being skipped, since a skipped required check counts as passing.
  ci:
    needs: [test]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - if: needs.test.result != 'success'
        run: |
          echo "test matrix result: ${{ needs.test.result }}"
          exit 1
      - run: echo "all tests passed on every OS and Node version"
