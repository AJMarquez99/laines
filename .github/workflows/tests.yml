name: tests

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # timeout-minutes: hook-runner tests spawn `sleep 30` process groups; a wedged child must not hold
  # a runner for 6 h.
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run test:run

  # Aggregator → the single required "ci" status check (green only if every matrix job passed).
  # `if: always()` keeps it from being skipped, since a skipped required check counts as passing.
  ci:
    needs: [test]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - if: needs.test.result != 'success'
        run: |
          echo "test matrix result: ${{ needs.test.result }}"
          exit 1
      - run: echo "all tests passed on every OS and Node version"
